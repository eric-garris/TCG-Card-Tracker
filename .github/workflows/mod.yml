name: Mod

on:
  pull_request:
    paths: ['mod/**', '.github/workflows/mod.yml']
  push:
    branches: [main]
    paths: ['mod/**', '.github/workflows/mod.yml']
    tags: ['mod-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/TCGCardTracker.Tests
      - run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TCG_Card_Tracker-mod
          path: mod/dist/*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/mod-v')
        uses: softprops/action-gh-release@v2
        with:
          files: mod/dist/*.zip
